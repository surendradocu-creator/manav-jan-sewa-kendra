<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin REAL</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Poppins;background:#f5f7fb}.header{background:#b71c1c;color:#fff;padding:12px 4%;display:flex;justify-content:space-between}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid #b71c1c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 4%}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#1a237e;color:#fff;padding:8px;text-align:left}td{padding:8px;border-bottom:1px solid #eee}input{padding:8px 12px;border:1.2px solid #ccc;border-radius:8px;width:100%;max-width:320px}.btn{padding:7px 12px;border:none;border-radius:8px;font-weight:800;font-size:11px;cursor:pointer}</style></head><body><div id="login" style="height:100vh;display:flex;align-items:center;justify-content:center;background:#b71c1c"><div style="background:#fff;padding:20px;border-radius:16px;width:90%;max-width:320px;text-align:center"><h3>🔐 Admin Login</h3><p style="font-size:11px;color:#666;margin:6px 0">Pass: 7351801904</p><input id="pass" type="password" placeholder="Password"><button class="btn" style="background:#b71c1c;color:#fff;width:100%;margin-top:10px;padding:10px" onclick="checkPass()">Login</button><p id="lmsg" style="font-size:11px;color:red;margin-top:6px"></p></div></div><div id="panel" style="display:none"><div class="header"><b>🔥 REAL Admin</b><span style="font-size:10px;background:#2e7d32;padding:4px 8px;border-radius:20px">🟢 Live</span></div><div class="grid"><div class="card"><div style="font-size:10px;color:#666">Retailers</div><div id="c1" style="font-size:20px;font-weight:800;color:#b71c1c">0</div></div><div class="card" style="border-left-color:#1a237e"><div style="font-size:10px;color:#666">Orders</div><div id="c2" style="font-size:20px;font-weight:800;color:#1a237e">0</div></div><div class="card" style="border-left-color:#2e7d32"><div style="font-size:10px;color:#666">Profit</div><div id="c3" style="font-size:20px;font-weight:800;color:#2e7d32">₹0</div></div><div class="card" style="border-left-color:#ff9800"><div style="font-size:10px;color:#666">Status</div><div style="font-size:12px;font-weight:800;color:#ff9800">✅ REAL DB</div></div></div><div style="padding:10px 4%;display:flex;gap:8px;flex-wrap:wrap"><input id="search" placeholder="🔍 Khojo..." onkeyup="doSearch()"><button class="btn" style="background:#2e7d32;color:#fff" onclick="exportCSV()">📊 Excel</button></div><div style="margin:10px 4%;background:#fff;border-radius:12px;overflow:hidden"><div style="display:flex"><button id="bR" onclick="showTab('R')" class="btn" style="flex:1;border-radius:0;background:#1a237e;color:#fff;padding:10px">👥 Retailers</button><button id="bO" onclick="showTab('O')" class="btn" style="flex:1;border-radius:0;background:#eee;padding:10px">📦 Orders</button></div><div id="divR" style="overflow:auto;max-height:60vh"><table id="tR"><tr><th>Name</th><th>Mobile</th><th>City</th><th>ID</th><th>Date</th></tr></table></div><div id="divO" style="overflow:auto;max-height:60vh;display:none"><table id="tO"><tr><th>Service</th><th>Customer</th><th>Mobile</th><th>Price</th><th>Profit</th><th>Date</th></tr></table></div></div></div></div><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";import {getFirestore, collection, onSnapshot, query, orderBy} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyCxPIcahQPr_DJVazVxlYfQIxRLLtGaNg",authDomain:"manavjansewakendra-ee14f.firebaseapp.com",projectId:"manavjansewakendra-ee14f",storageBucket:"manavjansewakendra-ee14f.firebasestorage.app",messagingSenderId:"556803528851",appId:"1:556803528851:web:a144573f17bbc8c6627d66",measurementId:"G-E3SKR6ZC1G"};const app=initializeApp(firebaseConfig);const db=getFirestore(app);let allR=[],allO=[];window.checkPass=()=>{if(document.getElementById('pass').value==='7351801904'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';startLive();}else{document.getElementById('lmsg').innerText='Galat password!';}};function startLive(){const qR=query(collection(db,"retailers"),orderBy("createdAt","desc"));onSnapshot(qR,(snap)=>{allR=[];let html='<tr><th>Name</th><th>Mobile</th><th>City</th><th>ID</th><th>Date</th></tr>';snap.forEach(d=>{let x=d.data();allR.push(x);html+=`<tr><td>${x.name||''}</td><td style="color:#b71c1c;font-weight:700">${x.mobile||''}</td><td>${x.city||''}</td><td>${x.retailerId||''}</td><td>${x.date||''}</td></tr>`});document.getElementById('tR').innerHTML=html;document.getElementById('c1').innerText=snap.size;});const qO=query(collection(db,"orders"),orderBy("createdAt","desc"));onSnapshot(qO,(snap)=>{allO=[];let html='<tr><th>Service</th><th>Customer</th><th>Mobile</th><th>Price</th><th>Profit</th><th>Date</th></tr>';let profit=0;snap.forEach(d=>{let x=d.data();allO.push(x);profit+=Number(x.profit||0);html+=`<tr><td>${x.service||''}</td><td>${x.customerName||''}</td><td>${x.mobile||''}</td><td>₹${x.price||''}</td><td style="color:#2e7d32;font-weight:800">₹${x.profit||''}</td><td>${x.date||''}</td></tr>`});document.getElementById('tO').innerHTML=html;document.getElementById('c2').innerText=snap.size;document.getElementById('c3').innerText='₹'+profit;});}window.showTab=(t)=>{document.getElementById('divR').style.display=t==='R'?'block':'none';document.getElementById('divO').style.display=t==='O'?'block':'none';document.getElementById('bR').style.background=t==='R'?'#1a237e':'#eee';document.getElementById('bR').style.color=t==='R'?'#fff':'#000';document.getElementById('bO').style.background=t==='O'?'#1a237e':'#eee';document.getElementById('bO').style.color=t==='O'?'#fff':'#000';};window.doSearch=()=>{let v=document.getElementById('search').value.toLowerCase();document.querySelectorAll('#tR tr, #tO tr').forEach((r,i)=>{if(i==0)return;r.style.display=r.innerText.toLowerCase().includes(v)?'':'none';});};window.exportCSV=()=>{let csv='Type,Name,Mobile,City,ID,Service,Price,Profit,Date\n';allR.forEach(r=>{csv+=`Retailer,${r.name},${r.mobile},${r.city},${r.retailerId},,,,${r.date}\n`});allO.forEach(o=>{csv+=`Order,${o.customerName},${o.mobile},,,${o.service},${o.price},${o.profit},${o.date}\n`});let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manav-data.csv';a.click();};</script></body></html>
